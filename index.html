const SESSION_KEY = "ada-shop-admin";
const engine = createAssistant({ assistantName: VENDOR.assistantName, lowStockThreshold: VENDOR.lowStockThreshold });

// --------------------------------------------------------------- seeding ---

const seedHistory = () => {
  const now = Date.now();
  return (VENDOR.history || []).map((h, i) => {
    const placedAt = new Date(now - (h.daysAgo * 86400000 + h.hoursAgo * 3600000 + i * 60000));
    const items = h.items.map((it) => {
      const product = VENDOR.products.find((p) => p.id === it.productId);
      return { productId: it.productId, name: product ? product.name : it.productId, qty: it.qty, price: product ? product.price : 0 };
    });
    const subtotal = items.reduce((n, i2) => n + i2.qty * i2.price, 0);
    const freeOver = VENDOR.delivery.freeOver || 0;
    const fee = subtotal === 0 || (freeOver > 0 && subtotal >= freeOver) ? 0 : VENDOR.delivery.fee;
    return {
      id: orderNumber(i),
      status: h.status,
      method: h.method,
      customer: h.customer,
      phone: h.phone,
      address: "Lagos",
      note: "",
      placedAt: placedAt.toISOString(),
      items,
      subtotal,
      deliveryFee: fee,
      total: subtotal + fee,
      offset: 0,
      paidTotal: subtotal + fee,
      source: "seed",
    };
  });
};

// The four scripted pitch orders keep their fixed ids; history follows them.
// The demo's pending transfers are written with fixed order numbers and
// amounts, but their 45-minute stock hold is re-anchored to "a few minutes
// ago" on every fresh seed, otherwise the hold has always already expired by
// the time anyone opens the demo, and the countdown never moves. Settled
// orders keep their real timestamps so the week's history stays a history.
const HOLD_ANCHORS = [9, 21, 38]; // minutes ago, staggered so the holds differ

const pitchOrders = () => {
  const now = Date.now();
  let held = 0;
  return VENDOR.orders.map((o) => {
    const minutesAgo = o.status === "pending" ? HOLD_ANCHORS[held++ % HOLD_ANCHORS.length] : 0;
    return {
      ...o,
      placedAt: o.status === "pending" ? new Date(now - minutesAgo * 60000).toISOString() : o.placedAt,
      subtotal: o.total,
      deliveryFee: 0,
      address: "Lagos",
      note: "",
      paidTotal: o.paid,
      source: "seed",
    };
  });
};

const seed = () => ({
  version: 1,
  seq: 31,
  myOrders: [], // order ids placed from this browser, "My orders" on the shop
  products: JSON.parse(JSON.stringify(VENDOR.products)),
  orders: [...pitchOrders(), ...seedHistory()],
  audit: [],
  cart: [],
  settings: {
    name: VENDOR.name,
    tagline: VENDOR.tagline,
    headline: VENDOR.headline,
    sub: VENDOR.sub,
    about: VENDOR.about,
    whatsapp: VENDOR.whatsapp,
    bank: { ...VENDOR.bank },
    delivery: { ...VENDOR.delivery },
    lowStockThreshold: VENDOR.lowStockThreshold,
    brand: { ...VENDOR.brand },
  },
});

// ---------------------------------------------------------------- state ----

let state = seed();
let session = false;
const listeners = new Set();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.products) && Array.isArray(parsed.orders)) {
        state = { ...seed(), ...parsed };
      }
    }
    session = localStorage.getItem(SESSION_KEY) === "1";
  } catch {
    /* private mode or corrupt data, stay on the seed */
  }
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch {
    /* full or blocked storage: the demo keeps working in memory */
  }
}

function emit() {
  for (const fn of listeners) {
    try {
      fn(state);
    } catch (err) {
      console.error("listener failed", err);
    }
  }
}

const uid = (prefix) => `${prefix}-${Date.now().toString(36)}${Math.floor(Math.random() * 1e4).toString(36)}`;

// ---------------------------------------------------------------- audit ----

// Fields the Activity screen offers to reverse. Creates, restores and the
// automatic reservation expiry are records, not undoable edits.
const UNDOABLE = ["stock", "price", "available", "name", "category", "photo", "aliases", "order_status", "setting", "__deleted__"];

function log(entry) {
  state.audit.unshift({
    id: uid("a"),
    at: new Date().toISOString(),
    undone: false,
    undoable: UNDOABLE.includes(entry.field) && entry.source !== "system",
    ...entry,
  });
  if (state.audit.length > 200) state.audit.length = 200;
}

// The chat only ever touches these three fields, the same whitelist the
// engine enforces, repeated here so a UI bug still cannot write anything else.
const CHAT_FIELDS = ["stock", "price", "available"];

function applyAction(action, productId, source = "chat") {
  const product = state.products.find((p) => p.id === productId);
  const check = engine.validateAction(action, product);
  if (!check.ok) return { ok: false, error: check.error };
  if (!CHAT_FIELDS.includes(action.field)) return { ok: false, error: "That change isn't allowed." };

  const from = product[action.field];
  if (from === action.to) return { ok: false, error: "Nothing to change." };
  product[action.field] = action.to;
  log({
    source,
    productId: product.id,
    productName: product.name,
    field: action.field,
    from,
    to: action.to,
    label: labelFor(action.field, from, action.to),
  });
  save();
  emit();
  return { ok: true };
}

function labelFor(field, from, to) {
  if (field === "price") return `price ${engine.formatNaira(from)} → ${engine.formatNaira(to)}`;
  if (field === "stock") return `stock ${from} → ${to}`;
  if (field === "available") return to ? "sold out → available" : "available → sold out";
  if (field === "name") return `renamed “${from}” → “${to}”`;
  if (field === "photo") return from ? "photo replaced" : "photo added";
  if (field === "aliases") return `search words: ${[].concat(from || []).join(", ") || "none"} → ${[].concat(to || []).join(", ") || "none"}`;
  return `${field}: ${from} → ${to}`;
}

// Undo refuses when the value moved since, it will never silently reverse
// someone else's newer edit.
function undo(entryId) {
  const entry = state.audit.find((a) => a.id === entryId);
  if (!entry || entry.undone || !entry.undoable) return { ok: false, error: "That change can't be undone from here." };
  if (entry.field === "order_status") {
    const order = findOrder(state.orders, entry.orderId);
    if (!order) return { ok: false, error: "That order is gone." };
    if (order.status !== entry.to) return { ok: false, error: `Order ${order.id} has moved on since. Undo would overwrite a newer change.` };
    order.status = entry.from;
    order.statusAt = new Date().toISOString();
    log({ source: "undo", orderId: order.id, field: "order_status", from: entry.to, to: entry.from, label: `undid: ${entry.label}` });
    entry.undone = true;
    save();
    emit();
    return { ok: true };
  }
  if (entry.field === "setting") {
    // "!name" is a top-level setting; "bank.accountNumber" is one inside a group.
    const [group, key] = entry.key.startsWith("!") ? [null, entry.key.slice(1)] : entry.key.split(".");
    const holder = group ? state.settings[group] : state.settings;
    if (!holder || holder[key] !== entry.to) return { ok: false, error: "That setting changed since. Undo would overwrite a newer edit." };
    holder[key] = entry.from;
    log({ source: "undo", field: "setting", key: entry.key, from: entry.to, to: entry.from, label: `undid: ${entry.label}` });
    entry.undone = true;
    save();
    emit();
    return { ok: true };
  }
  if (entry.field === "__deleted__") {
    if (state.products.some((p) => p.id === entry.productId)) {
      return { ok: false, error: "A product with that id exists again. Not restoring." };
    }
    state.products.push(JSON.parse(entry.from));
    log({ source: "admin", productId: entry.productId, productName: entry.productName, field: "__restored__", from: null, to: entry.productId, label: "restored the product" });
    entry.undone = true;
    save();
    emit();
    return { ok: true };
  }
  const product = state.products.find((p) => p.id === entry.productId);
  if (!product) return { ok: false, error: "That product is gone." };
  if (product[entry.field] !== entry.to) {
    return { ok: false, error: `“${product.name}” has changed since. Undo would overwrite a newer edit.` };
  }
  product[entry.field] = entry.from;
  log({
    source: "undo",
    productId: product.id,
    productName: product.name,
    field: entry.field,
    from: entry.to,
    to: entry.from,
    label: `undid: ${entry.label}`,
  });
  entry.undone = true;
  save();
  emit();
  return { ok: true };
}

// ------------------------------------------------------------- products ----

function updateProduct(id, patch, source = "admin") {
  const product = state.products.find((p) => p.id === id);
  if (!product) {
    if (!patch.name) return { ok: false, error: "A name is required." };
    const created = {
      id: uid("p"),
      name: String(patch.name),
      aliases: Array.isArray(patch.aliases) ? patch.aliases : [],
      category: patch.category || "Other",
      price: Math.max(engine.settings.minPrice, Math.round(Number(patch.price) || 0)),
      stock: Math.max(0, Math.round(Number(patch.stock) || 0)),
      available: patch.available !== false,
      photo: patch.photo || "",
    };
    state.products.push(created);
    log({ source, productId: created.id, productName: created.name, field: "__created__", from: null, to: created.id, label: "added a product" });
    save();
    emit();
    return { ok: true, product: created };
  }
  const changes = [];
  for (const field of ["name", "category", "photo", "aliases", "price", "stock", "available"]) {
    if (!(field in patch)) continue;
    let next = patch[field];
    if (field === "price") {
      next = Math.round(Number(next));
      if (!Number.isFinite(next) || next < engine.settings.minPrice) return { ok: false, error: `Price must be at least ${engine.formatNaira(engine.settings.minPrice)}.` };
    }
    if (field === "stock") {
      next = Math.round(Number(next));
      if (!Number.isFinite(next) || next < 0) return { ok: false, error: "Stock must be 0 or more." };
    }
    if (field === "name") {
      next = String(next).trim();
      if (!next) return { ok: false, error: "A name is required." };
    }
    if (field === "aliases" && typeof next === "string") {
      next = next.split(",").map((s) => s.trim()).filter(Boolean);
    }
    if (field === "available") next = !!next;
    const before = product[field];
    if (JSON.stringify(before) === JSON.stringify(next)) continue;
    product[field] = next;
    log({ source, productId: product.id, productName: product.name, field, from: before, to: next, label: labelFor(field, before, next) });
    changes.push(field);
  }
  if (!changes.length) return { ok: false, error: "Nothing changed." };
  save();
  emit();
  return { ok: true, changes };
}

function deleteProduct(id) {
  const product = state.products.find((p) => p.id === id);
  if (!product) return { ok: false, error: "That product is already gone." };
  state.products = state.products.filter((p) => p.id !== id);
  state.cart = removeFromCart(state.cart, id);
  log({
    source: "admin",
    productId: id,
    productName: product.name,
    field: "__deleted__",
    from: JSON.stringify(product),
    to: null,
    label: "deleted the product (chat can't do this)",
  });
  save();
  emit();
  return { ok: true };
}

// --------------------------------------------------------------- orders ----

function nextOrderId() {
  state.seq += 1;
  return orderNumber(state.seq);
}

function placeOrder({ customer, address, note, method }) {
  const lines = state.cart
    .map((line) => {
      const product = state.products.find((p) => p.id === line.productId);
      if (!product) return null;
      return { productId: product.id, name: product.name, qty: line.qty, price: product.price };
    })
    .filter(Boolean);
  if (!lines.length) return { ok: false, error: "Your cart is empty." };

  // Re-check stock at the moment of order: a chat edit may have sold it out
  // while the cart was open.
  const held = activeReservations(state.orders, Date.now());
  for (const line of lines) {
    const product = state.products.find((p) => p.id === line.productId);
    const available = product.stock - held.filter((h) => h.productId === product.id).reduce((n, h) => n + h.qty, 0);
    if (!product.available || available < line.qty) {
      return { ok: false, error: `Only ${Math.max(0, available)} left of ${product.name}.` };
    }
  }

  const subtotal = lines.reduce((n, l) => n + l.qty * l.price, 0);
  const freeOver = state.settings.delivery.freeOver || 0;
  const deliveryFee = freeOver > 0 && subtotal >= freeOver ? 0 : state.settings.delivery.fee || 0;
  const total = subtotal + deliveryFee;
  const id = nextOrderId();
  const takenOffsets = state.orders.filter((o) => o.status === "pending").map((o) => o.offset);
  const offset = method === "transfer" ? uniqueOffset(total, takenOffsets) : 0;

  const status = method === "transfer" ? "pending" : method === "card" ? "paid" : "new";
  const order = {
    id,
    status,
    method,
    customer: String(customer || "").trim(),
    address: String(address || "").trim(),
    note: String(note || "").trim(),
    placedAt: new Date().toISOString(),
    items: lines,
    subtotal,
    deliveryFee,
    total,
    offset,
    paidTotal: method === "transfer" ? paidAmount(total, offset) : total,
    source: "storefront",
  };
  state.orders.unshift(order);
  state.myOrders = [order.id, ...(state.myOrders || [])].slice(0, 30);
  state.cart = [];
  save();
  emit();
  return { ok: true, order };
}

// Settings (bank details, delivery fee, thresholds) are deliberately NOT
// reachable from the chat, the engine refuses "change my bank account".
// They live here, and every change is audited like everything else.
function updateSettings(patch, source = "admin") {
  const changes = [];
  for (const [path, raw] of Object.entries(patch)) {
    const [group, key] = path.startsWith("!") ? [null, path.slice(1)] : path.split(".");
    const holder = group ? state.settings[group] : state.settings;
    if (!holder || key == null) continue;
    let value = raw;
    if (typeof holder[key] === "number") {
      value = Number(raw);
      if (!Number.isFinite(value) || value < 0) return { ok: false, error: "That has to be a number, 0 or more." };
    }
    if (String(holder[key]) === String(value)) continue;
    const from = holder[key];
    holder[key] = value;
    log({ source, field: "setting", key: path, from, to: value, label: `${group ? `${group}.` : ""}${key}: “${from}” → “${value}”` });
    changes.push(path);
  }
  if (!changes.length) return { ok: false, error: "Nothing changed." };
  save();
  emit();
  return { ok: true, changes };
}

function setOrderStatus(id, status, source = "admin") {
  const order = findOrder(state.orders, id);
  if (!order) return { ok: false, error: "Order not found." };
  if (order.status === status) return { ok: false, error: "Already there." };
  const from = order.status;
  order.status = status;
  order.statusAt = new Date().toISOString();
  log({
    source,
    orderId: order.id,
    field: "order_status",
    from,
    to: status,
    label: `order ${order.id}: ${from} → ${status}`,
  });
  save();
  emit();
  return { ok: true };
}

// Run on load and on a timer. In production this is the Cron Trigger.
function expireReservations() {
  const { orders, released } = releaseExpired(state.orders, Date.now());
  if (released.length) {
    state.orders = orders;
    for (const r of released) {
      log({ source: "system", orderId: r.orderId, field: "order_status", from: "pending", to: "expired", label: `order ${r.orderId}: reservation expired, stock released` });
    }
    save();
    emit();
  }
  return released;
}

// ---------------------------------------------------------------- cart -----

function commit(nextCart) {
  if (JSON.stringify(nextCart) !== JSON.stringify(state.cart)) {
    state.cart = nextCart;
    save();
    emit();
  }
  return state.cart;
}
const cartCtx = () => ({
  products: state.products,
  reservations: activeReservations(state.orders, Date.now()),
  now: Date.now(),
});

// Returns what actually happened, so the storefront can say "only 2 left"
// instead of pretending the tap worked.
function addItem(productId, qty = 1) {
  const { products, reservations, now } = cartCtx();
  const product = products.find((p) => p.id === productId);
  if (!product) return { ok: false, error: "That product is gone." };
  const line = (cart) => cart.find((l) => l.productId === productId);
  const was = line(state.cart) ? line(state.cart).qty : 0;
  const next = addToCart(state.cart, product, qty, reservations, now);
  if (!line(next)) return { ok: false, error: `${product.name} is sold out.` };
  const is = line(next).qty;
  commit(next);
  return { ok: true, qty: is, added: is - was, capped: is - was < qty };
}

function changeItem(productId, qty) {
  const { products, reservations, now } = cartCtx();
  return { ok: true, cart: commit(setCartQty(state.cart, productId, qty, reservations, now, products)) };
}
function dropItem(productId) {
  return commit(removeFromCart(state.cart, productId));
}
function clearCart() {
  return commit([]);
}

// --------------------------------------------------------------- session ---

// Demo-only gate: constant strings, no crypto, and the credential is printed
// on the login card. It exists so the flow is real; production replaces this
// wholesale with a Worker endpoint (PBKDF2 + httpOnly cookie + rate limiting).
const attempts = { count: 0, until: 0 };
function login(user, password) {
  const now = Date.now();
  if (attempts.until > now) return { ok: false, error: `Too many tries. Wait ${Math.ceil((attempts.until - now) / 1000)}s.` };
  const ok = user === VENDOR.demoAdmin.user && password === VENDOR.demoAdmin.password;
  if (!ok) {
    attempts.count += 1;
    if (attempts.count >= 5) {
      attempts.until = now + 30000;
      attempts.count = 0;
      return { ok: false, error: "Too many tries. Locked for 30 seconds." };
    }
    return { ok: false, error: "Wrong user or password." };
  }
  attempts.count = 0;
  session = true;
  try {
    localStorage.setItem(SESSION_KEY, "1");
  } catch {
    /* ignored */
  }
  emit();
  return { ok: true };
}
function logout() {
  session = false;
  try {
    localStorage.removeItem(SESSION_KEY);
  } catch {
    /* ignored */
  }
  emit();
}

// ------------------------------------------------------------------ api ----

load();
expireReservations();

const DB = {
  engine,
  get state() {
    return state;
  },
  get products() {
    return state.products;
  },
  get orders() {
    return state.orders;
  },
  get audit() {
    return state.audit;
  },
  get cart() {
    return state.cart;
  },
  get myOrders() {
    return state.myOrders || [];
  },
  get settings() {
    return state.settings;
  },
  get isAdmin() {
    return session;
  },

const __scope_chat = (() => {
// chat.js: the assistant panel. This is the product; the rest of the site
// exists so vendors can see it in context.
//
// Everything the engine produces is one of a small set of "plans", and this
// file is the only place that turns a plan into DOM. The rules it enforces:
//
//   • Reads (orders, stock, sales, prices) render immediately, no confirmation.
//   • Writes ALWAYS render a confirm card with before → after, and the write
//     happens on Confirm, through DB.applyAction, which re-validates and logs.
//   • Anything unparsed or ambiguous falls back to the button menu. Never guess.
//   • All text goes in via textContent. Nothing here builds HTML from data.







const { el, icon, money, toast, sheet, badge, clock } = UI;

const A = DB.engine;

const TRANSFER_WARNING =
  "Confirm the money in your bank app before approving. Ignore screenshots and SMS alerts.";

// The fallback menu, per spec: ambiguous or unparsed input always lands here.
const MENU = [
  { label: "Update stock", intent: INTENTS.SET_STOCK, icon: "box" },
  { label: "Change price", intent: INTENTS.SET_PRICE, icon: "tag" },
  { label: "Mark sold out", intent: INTENTS.MARK_UNAVAILABLE },
  { label: "Mark available", intent: INTENTS.MARK_AVAILABLE },
  { label: "Pending orders", intent: INTENTS.LIST_PENDING },
  { label: "Low stock", intent: INTENTS.LIST_LOW_STOCK },
  { label: "Sales today", intent: INTENTS.SALES_SUMMARY },
  { label: "Best sellers", intent: INTENTS.BEST_SELLERS },
];

// ------------------------------------------------------------ persistence --

// The panel is built once and re-attached on every route render, so the
// conversation, the chips and anything half-confirmed survive navigation.
let panel = null;
let logEl = null;
let chipsEl = null;
let inputEl = null;
let scrollEl = null;
let pendingPrefill = null;
let refreshHook = () => {};

const toBottom = () => {
  if (scrollEl) scrollEl.scrollTop = scrollEl.scrollHeight;
};
const changed = () => {
  try {
    refreshHook();
  } catch {
    /* a view that cannot repaint must never break the chat */
  }
};

// ---------------------------------------------------------------- pieces ---

function bubble(role, text, tone) {
  const body = el("div", { class: `bubble ${tone || ""}`, text });
  const row = el("div", { class: `row ${role}` }, [
    role === "ada" ? el("span", { class: "avatar", text: VENDOR.assistantName[0] }) : null,
    body,
  ]);
  logEl.appendChild(row);
  toBottom();
  return body;
}
const say = (text) => bubble("ada", text);
const hear = (text) => bubble("user", text);

function setChips(items) {
  chipsEl.textContent = "";
  for (const it of items) {
    if (!it) continue;
    chipsEl.appendChild(
      el("button", {
        class: `chip ${it.tone || ""}`,
        type: "button",
        onclick: it.onClick,
      }, [it.icon ? icon(it.icon, 15) : null, el("span", { text: it.label })])
    );
  }
}

function menuChips() {
  setChips([
    ...MENU.map((m) => ({
      label: m.label,
      icon: m.icon,
      onClick: () => {
        hear(m.label);
        show(A.begin(m.intent));
      },
    })),
  ]);
}

function doneRow(cardBody, plan) {
  const entry = DB.audit[0];
  const undoBtn = el("button", {
    class: "link",
    text: "Undo",
    onclick: (e) => {
      const r = DB.undo(entry.id);
      if (!r.ok) {
        toast(r.error);
        return;
      }
      e.currentTarget.disabled = true;
      e.currentTarget.textContent = "Undone";
      say("Undone. Back to how it was.");
      changed();
    },
  });
  cardBody.appendChild(el("div", { class: "done-row" }, [icon("check", 15), el("span", { text: "Applied" }), undoBtn]));

  if (plan.followUps && plan.followUps.length) {
    setChips(
      plan.followUps.map((f) => ({
        label: f.label,
        tone: "primary",
        onClick: () => {
          hear(f.label);
          show(A.buildPlan(f.intent, DB.products.find((p) => p.id === f.productId), null));
        },
      }))
    );
  } else {
    menuChips();
  }
}

// ---------------------------------------------------------------- writes ---

// The confirm card. Nothing is written until the vendor taps Confirm, and the
// card always shows the actual before → after the engine computed.
function showConfirm(plan) {
  const row = el("div", { class: "row ada" });
  const card = el("div", { class: "card" });
  const body = el("div", { class: "card-body" });
  const actions = el("div", { class: "actions" });

  const from = plan.action.from;
  const to = plan.action.to;
  const pretty = (v) => (plan.action.field === "price" ? money(v) : plan.action.field === "available" ? (v ? "available" : "sold out") : String(v));

  body.appendChild(el("p", { class: "card-msg", text: plan.message }));
  if (plan.sub) body.appendChild(el("p", { class: "sub", text: plan.sub }));
  body.appendChild(
    el("div", { class: "diff" }, [
      el("span", { class: "pill", text: pretty(from) }),
      el("span", { class: "arrow", text: "→" }),
      el("span", { class: "pill to", text: pretty(to) }),
    ])
  );
  card.appendChild(body);

  const yes = el("button", { class: "primary-btn", text: "Confirm" });
  const no = el("button", { class: "secondary-btn", text: "Not now" });
  actions.appendChild(yes);
  actions.appendChild(no);
  card.appendChild(actions);

  row.appendChild(el("span", { class: "avatar", text: VENDOR.assistantName[0] }));
  row.appendChild(card);
  logEl.appendChild(row);
  toBottom();

  no.addEventListener("click", () => {
    actions.remove();
    body.appendChild(el("p", { class: "sub", text: "No change made." }));
    menuChips();
  });

  yes.addEventListener("click", () => {
    const res = DB.applyAction(plan.action, plan.action.productId, "chat");
    actions.remove();
    if (!res.ok) {
      body.appendChild(el("p", { class: "sub danger", text: res.error }));
      say(res.error, "warn");
      menuChips();
      return;
    }
    doneRow(body, plan);
    changed();
  });
}

function showPick(plan) {
  say(plan.message);
  const box = el("div", { class: "pick" });
  for (const c of plan.candidates) {
    const p = DB.products.find((x) => x.id === c.productId);
    box.appendChild(
      el("button", {
        class: "pick-row",
        type: "button",
        onclick: () => {

        el("span", { class: "meta" }, [

          el("span", { class: "muted", text: p ? `${p.category} · ${money(p.price)} · ${p.available ? (p.stock ? `${p.stock} in stock` : "0 left") : "sold out"}` : "" }),

function showClarify(plan) {

  const box = el("div", { class: "pick" });

function showNeedNumber(plan) {

// ----------------------------------------------------------------- reads ---

// Reads answer from the same shop.js maths the dashboard uses, so the chat and
// the screens can never show different numbers.
function readPlanText(plan) {
  const orders = DB.orders;
  const now = Date.now();

  switch (plan.readIntent) {
    case "list_pending": {
      const pending = orders.filter((o) => o.status === "pending");
      if (!pending.length) return "No pending transfers. Everything is approved. 🎉";
      const lines = pending.map((o) => {
        const hold = reservationFor(o, now);
        const bits = [`• ${o.id}: expect ${money(o.paidTotal ?? o.total)} · ${o.customer}`];
        if (hold) bits.push(`holding stock ${clock(hold.msLeft)} more`);
        return bits.join(" · ");
      });
      return `${pending.length} pending transfer${pending.length === 1 ? "" : "s"}:\n${lines.join("\n")}\n\n${TRANSFER_WARNING}`;
    }
    case "list_low_stock": {
      const low = DB.lowStock();
      if (!low.length) return `Nothing is running low, every available product has more than ${DB.settings.lowStockThreshold} in stock.`;
      return "Running low:\n" + low.map((p) => `• ${p.name}: ${p.stock} left · ${money(p.price)}`).join("\n") + "\n\nTap a product to top it up, or just type “add 20”.";
    }
    case "list_orders": {
      const recent = [...orders].sort((a, b) => String(b.placedAt).localeCompare(String(a.placedAt))).slice(0, 7);
      if (!recent.length) return "No orders yet.";
      const lines = recent.map((o) => `• ${o.id}: ${statusLabel(o)} · ${money(o.paidTotal ?? o.total)} · ${o.customer}`);
      const waiting = orders.filter((o) => o.status === "pending" || o.status === "new").length;
      return `Latest ${recent.length} of ${orders.length} orders:\n${lines.join("\n")}\n\n${waiting} still need${waiting === 1 ? "s" : ""} your attention.`;
    }
    case "order_info": {
      const o = DB.findOrder(plan.orderId);
      if (!o) return `I can't find an order numbered ${plan.orderId}. Check the number, or open Orders for the full list.`;
      const hold = reservationFor(o, now);
      const lines = [
        `${o.id}, ${statusLabel(o)}`,
        `${o.customer}${o.phone ? " · " + o.phone : ""}`,
        o.address ? o.address : null,
        "",
        ...o.items.map((i) => `${i.qty} × ${i.name}: ${money(i.price * i.qty)}`),
        "",
        `Total ${money(o.total)} · ${o.method === "transfer" ? "bank transfer" : o.method === "card" ? "card" : "pay on delivery"}`,
        o.paidTotal && o.paidTotal !== o.total ? `Expecting exactly ${money(o.paidTotal)} (includes the ${money(o.paidTotal - o.total)} offset)` : null,
        o.note ? `Note: ${o.note}` : null,
        hold ? `Holding stock for ${clock(hold.msLeft)} more` : null,
        o.status === "pending" ? TRANSFER_WARNING : null,
      ].filter((x) => x != null);
      return lines.join("\n");
    }
    case "sales_summary": {
      const s = DB.stats();
      const top = s.topSeller;
      return [
        `Today: ${money(s.todayRevenue)} from ${s.todayOrders} paid order${s.todayOrders === 1 ? "" : "s"}.`,
        `Still to confirm: ${s.pendingCount} transfer${s.pendingCount === 1 ? "" : "s"} worth ${money(s.pendingValue)}.`,
        `All time: ${money(s.paidRevenue)} from ${s.paidOrders} paid orders.`,
        top ? `Best seller: ${top.name} (${top.units} sold).` : null,
      ].filter(Boolean).join("\n");
    }
    case "best_sellers": {
      const best = DB.bestSellers(5);
      if (!best.length) return "No paid orders yet, so no best sellers. 🐣";
      return "Best sellers this week:\n" + best.map((b, i) => `${i + 1}. ${b.name}: ${b.units} sold · ${money(b.revenue)}`).join("\n");
    }
    case "product_info": {
      const p = DB.products.find((x) => x.id === plan.productId);
      if (!p) return "That product is no longer in the catalogue.";
      const reserved = DB.reservations().filter((r) => r.productId === p.id).reduce((n, r) => n + r.qty, 0);
      return [
        p.name,
        `${money(p.price)} · ${p.stock} in stock · ${p.available ? "available in the shop" : "showing as Sold out"}`,
        reserved ? `${reserved} held for customers who are still paying.` : null,
        p.aliases && p.aliases.length ? `Customers find it by: ${p.aliases.join(", ")}` : null,
      ].filter(Boolean).join("\n");
    }
    default:
      return plan.message || "(nothing to show)";
  }
}

function showRead(plan) {
  say(readPlanText(plan));
  const chips = [];
  if (plan.readIntent === "list_pending") chips.push({ label: "Open Orders", tone: "primary", onClick: () => (location.hash = "#/admin/orders") });
  if (plan.readIntent === "list_orders") chips.push({ label: "Open Orders", tone: "primary", onClick: () => (location.hash = "#/admin/orders") });

// --------------------------------------------------------------- dispatch --

// One entry point for every plan the engine produces.
function show(plan) {
  if (!plan) return menuChips();
  switch (plan.kind) {
    case "confirm": return showConfirm(plan);
    case "pick_product": return showPick(plan);
    case "clarify_amount": return showClarify(plan);
    case "read": return showRead(plan);
    case "need_number": return showNeedNumber(plan);
    case "help": return showHelp(plan);
    case "info":
      say(plan.message);
      return menuChips();
    case "refuse":
      say(plan.message, "warn");
      return menuChips();
    case "greet":
      say(plan.message);
      return menuChips();
    default:
      say(plan.message || "I didn't quite get that. Here's what I can do:");
      return menuChips();
  }
}

function submit(text) {
  const clean = String(text || "").trim();
  if (!clean) return;
  hear(clean);
  show(A.parse(clean, DB.products));
}

// ---------------------------------------------------------------- numpad ---

const MODE_LABEL = { stock: "Set stock", add: "Add stock", reduce: "Remove stock", price: "Set price" };
const MODE_INTENT = { stock: INTENTS.SET_STOCK, add: INTENTS.ADD_STOCK, reduce: INTENTS.REDUCE_STOCK, price: INTENTS.SET_PRICE };

// The sheet keypad: the same confirm card, but the number arrives by tapping
// instead of typing, the fast path on a phone with one thumb.
function openNumpad(mode, product) {
  let m = mode;
  let val = "";

  const display = el("div", { class: "np-display", text: "0" });
  const preview = el("div", { class: "np-preview" });
  const sub = el("p", { class: "sub" });
  const modeBtns = {};

  const paint = () => {
    const live = DB.products.find((p) => p.id === product.id) || product;
    sub.textContent = `${live.name} · ${money(live.price)} · ${live.stock} in stock`;
    for (const [k, b] of Object.entries(modeBtns)) b.classList.toggle("on", k === m);
    kKey.textContent = m === "price" ? "k" : "00";
    const n = Number(val || "0");
    display.textContent = val ? (m === "price" ? money(n) : val) : "0";
    if (!val) preview.textContent = "";
    else if (m === "price") preview.textContent = `price ${money(live.price)} → ${money(n)}`;
    else if (m === "stock") preview.textContent = `stock ${live.stock} → ${n}`;
    else if (m === "add") preview.textContent = `stock ${live.stock} → ${live.stock + n}`;
    else preview.textContent = n > live.stock ? `Only ${live.stock} in stock` : `stock ${live.stock} → ${live.stock - n}`;
  };

  const press = (t) => {
    val = (val + t).slice(0, 9);
    paint();
  };
  const keyBtn = (label, onClick, cls) => el("button", { class: `np-key ${cls || ""}`, type: "button", text: label, onclick: onClick });

  const kKey = keyBtn("k", () => press(m === "price" ? "000" : "00"), "fn");
  const keys = el("div", { class: "np-keys" }, [
    keyBtn("1", () => press("1")), keyBtn("2", () => press("2")), keyBtn("3", () => press("3")),
    keyBtn("⌫", () => { val = val.slice(0, -1); paint(); }, "fn"),
    keyBtn("4", () => press("4")), keyBtn("5", () => press("5")), keyBtn("6", () => press("6")),
    kKey,
    keyBtn("7", () => press("7")), keyBtn("8", () => press("8")), keyBtn("9", () => press("9")),
    keyBtn("000", () => press("000"), "fn"),
    keyBtn("0", () => press("0")),
    el("button", {
      class: "np-key done",
      type: "button",
      text: "Done",
      onclick: () => {
        if (!val) {
          toast("Enter a number first.");
          return;
        }
        const live = DB.products.find((p) => p.id === product.id);
        close();
        if (!live) {
          say("That product is no longer in the catalogue.", "warn");
          return menuChips();
        }
        show(A.buildPlan(MODE_INTENT[m], live, Number(val)));
      },
    }),
  ]);

  const modes = el("div", { class: "np-modes" }, Object.keys(MODE_LABEL).map((key) => {
    const b = el("button", { class: "chip", type: "button", text: MODE_LABEL[key], onclick: () => { m = key; paint(); } });
    modeBtns[key] = b;
    return b;
  }));

  const close = sheet({
    title: `${VENDOR.assistantName} · enter a number`,
    body: [sub, modes, display, preview, keys],
  }).close;

  paint();
}

// ------------------------------------------------------------------ panel --

function buildPanel() {
  logEl = el("div", { class: "chat-log", role: "log", "aria-live": "polite" });
  chipsEl = el("div", { class: "chips chat-chips" });
  inputEl = el("input", {
    class: "composer-input",
    placeholder: `Tell ${VENDOR.assistantName} what changed… e.g. “red bag 12k”`,
    "aria-label": "Message the shop assistant",
    autocomplete: "off",
    maxlength: "160",
  });
  const form = el("form", { class: "composer", onsubmit: (e) => { e.preventDefault(); const t = inputEl.value; inputEl.value = ""; submit(t); } });
  form.appendChild(inputEl);
  form.appendChild(el("button", { class: "send-btn", type: "submit", "aria-label": "Send" }, [icon("check", 17)]));

  scrollEl = el("div", { class: "chat-scroll" }, [logEl]);

  panel = el("div", { class: "chat-panel" }, [
    el("div", { class: "chat-head" }, [
      el("span", { class: "avatar sm", text: VENDOR.assistantName[0] }),
      el("div", { class: "row-mid" }, [
        el("strong", { text: VENDOR.assistantName }),
        el("span", { class: "muted tiny", text: "Rule-based assistant · no AI, no internet" }),
      ]),
      el("button", { class: "chip ghost", type: "button", text: "What can you do?", onclick: () => { hear("What can you do?"); show(A.begin(INTENTS.HELP)); } }),
    ]),
    scrollEl,
    chipsEl,
    form,
  ]);
  return panel;
}

function greet() {
  say(`Hi! I'm ${VENDOR.assistantName}, the assistant for ${VENDOR.name}. I change stock, prices and availability, and I can read your orders, sales and low stock back to you.`);
  say("No AI here: I follow rules, and I always show you a confirm card before anything changes. Type it the way you'd say it, e.g. “red bag 12k”, or tap a button.");
  menuChips();
}

function applyPrefill() {
  if (pendingPrefill == null || !inputEl) return;
  inputEl.value = pendingPrefill;
  pendingPrefill = null;
  inputEl.focus();
  const n = inputEl.value.length;
  try {
    inputEl.setSelectionRange(n, n);
  } catch {
    /* ignore */
  }
}

const Chat = {
  // Mount into a container. The panel itself is built once and moved, so the
  // conversation survives every re-render of the page around it.
  mount(container, onChange) {
    if (typeof onChange === "function") refreshHook = onChange;
    if (!panel) {
      buildPanel();
      greet();
    }
    container.appendChild(panel);
    applyPrefill();
    toBottom();
    return panel;
  },
  // Called from a product row or a dashboard button: jump to the chat with the
  // sentence half-typed, so the vendor finishes it instead of hunting a form.
  prefill(text) {
    pendingPrefill = text;
    if (typeof App !== "undefined" && App && typeof App.go === "function") App.go("admin-chat");
    else location.hash = "#/admin/chat";
  },
  reset() {
    if (!panel) return;
    logEl.textContent = "";
    greet();
  },
  get isOpen() {
    return !!(panel && panel.isConnected);
  },
};
return { Chat };

  const paint = () => {

function productEditor(product, onChange) {
  const isNew = !product;
  const p = product || { name: "", category: "", price: 0, stock: 0, available: true, aliases: [], photo: "" };
  const fields = {
    name: el("input", { class: "field", value: p.name, placeholder: "Product name" }),
    category: el("input", { class: "field", value: p.category, placeholder: "Category (e.g. Wigs)", list: "cat-list" }),
    price: el("input", { class: "field", type: "number", inputmode: "numeric", value: String(p.price), placeholder: "Price in naira" }),
    stock: el("input", { class: "field", type: "number", inputmode: "numeric", value: String(p.stock), placeholder: "Stock" }),
    aliases: el("input", { class: "field", value: (p.aliases || []).join(", "), placeholder: "Search words, comma separated (e.g. ankara, gown)" }),
    available: el("input", { type: "checkbox", checked: p.available !== false }),
  };
  const preview = el("img", { class: "photo-preview", src: photoOf(p), alt: "Product photo" });
  const err = el("p", { class: "form-error", role: "alert" });
  let photo = p.photo || "";

  const file = el("input", { type: "file", accept: "image/*", class: "file-input", onchange: async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      photo = await UI.compressImage(f);
      preview.src = photo;
      const kb = Math.round(photo.length / 1024);
      err.textContent = "";
      toast(`Photo compressed to ~${kb} KB in the browser.`);
    } catch (e2) {
      err.textContent = e2.message;
    }
  } });

  const save = () => {
    err.textContent = "";
    const patch = {
      name: fields.name.value.trim(),
      category: fields.category.value.trim() || "Other",
      price: Number(fields.price.value),
      stock: Number(fields.stock.value),
      aliases: fields.aliases.value,
      available: fields.available.checked,
    };
    if (!isNew || photo) patch.photo = photo;
    const res = DB.updateProduct(p ? p.id : null, patch, "admin");
    if (!res.ok) {
      err.textContent = res.error;
      return;
    }
    toast(isNew ? "Product added." : "Saved.");
    onChange();
    close();
  };

  const actions = [
    el("button", { class: "primary-btn", onclick: save, text: isNew ? "Add product" : "Save changes" }),
    el("button", { class: "secondary-btn", text: "Not now", onclick: () => close() }),
  ];
  if (!isNew) {
    actions.unshift(el("button", {
      class: "link danger",
      text: "Delete",
      onclick: () => {
        const confirmSheet = sheet({
          title: `Delete “${p.name}”?`,
          body: [
            el("p", { class: "muted", text: "This is the kind of thing the chat is not allowed to do. It lives here, where you can see the whole product. It is logged and can be undone from Activity." }),
          ],
          actions: [
            el("button", { class: "danger-btn", text: "Yes, delete it", onclick: () => { DB.deleteProduct(p.id); toast("Deleted. Undo lives in Activity."); onChange(); confirmSheet.close(); close(); } }),
            el("button", { class: "secondary-btn", text: "Keep it", onclick: () => confirmSheet.close() }),
          ],
        });
      },
    }));
  }

  const quick = el("div", { class: "chat-quick" }, [
    el("span", { class: "muted small", text: "Or do it by chat:" }),
    el("button", { class: "chip", text: `price`, onclick: () => { close(); Chat.prefill(`${p.name} price `); } }),
    el("button", { class: "chip", text: `stock`, onclick: () => { close(); Chat.prefill(`${p.name} `); } }),
    el("button", { class: "chip", text: `sold out`, onclick: () => { close(); Chat.prefill(`${p.name} is sold out`); } }),
  ]);

  const close = sheet({
    title: isNew ? "Add a product" : p.name,
    body: [
      el("div", { class: "photo-row" }, [preview, el("div", { class: "photo-actions" }, [el("label", { class: "secondary-btn small" }, [el("span", { text: "Upload photo" }), file]), el("span", { class: "muted small", text: "Compressed in your browser before it is stored." })])]),
      el("label", { class: "field-label", text: "Name" }), fields.name,
      el("label", { class: "field-label", text: "Category" }), fields.category,
      el("label", { class: "field-label", text: "Price (₦)" }), fields.price,
      el("label", { class: "field-label", text: "Stock" }), fields.stock,
      el("label", { class: "field-label", text: "Search words" }), fields.aliases,
      el("label", { class: "check-row" }, [fields.available, el("span", { text: "Available in the shop" })]),
      err,
      !isNew ? quick : null,
    ],
    actions,
  });
}

const __scope_storefront = (() => {
// storefront.js: everything a customer sees: catalogue, search, product page,
// cart, the three payment methods, order status, order again, WhatsApp summary.
//
// It reads the same DB the chat admin writes. Change a price in the chat and
// this page shows the new price on the next render, that is the whole point of
// the demo, and why both sides go through DB and shop.js instead of local state.
//
// Layout notes: the home page is a real shop front, announcement bar, hero with
// a picture of the actual stock, category tiles, a sortable grid and a top-rated
// rail. Everything on it is derived from the catalogue (ratings, tags, "only 2
// left"), so nothing here can disagree with what the vendor typed in the chat.






const { el, frag, icon, money, photoOf, badge, sheet, toast, dateLabel, shortMoney, clock } = UI;

// The cart badge lives in the site header, which is rendered once by app.js.
// A quiet event keeps it in step without re-rendering the page under the
// customer's fingers (which would wipe the search box mid-typing).
const cartChanged = () => window.dispatchEvent(new Event("ada:cart"));

const searchIndex = (products) =>
  products.map((p) => ({
    id: p.id,
    _search: [p.name, ...(p.aliases || []), p.category || ""].join(" "),
  }));

function stockBadge(product, reservations, now) {
  if (!product.available) return badge("Sold out", "danger");
  const left = availableStock(product, reservations, now);
  if (left === 0) return badge("Sold out", "danger");
  if (left <= 3) return badge(`Only ${left} left`, "warn");
  return badge("In stock", "ok");
}

// Ratings are the shop's own numbers (vendor.config). Five stars is a string of
// characters, not an icon font, one less thing to load, and it renders offline.
const stars = (rating) => {
  const n = Math.max(0, Math.min(5, Math.round(Number(rating) || 0)));
  return "★".repeat(n) + "☆".repeat(5 - n);
};

const ratingLine = (product, { compact = false } = {}) => {
  if (!product.rating) return null;
  return el("span", { class: `p-rating ${compact ? "compact" : ""}` }, [
    el("span", { class: "stars", text: stars(product.rating) }),
    el("span", { class: "rating-num", text: String(product.rating) }),
    product.reviews ? el("span", { class: "rating-count", text: `(${product.reviews})` }) : null,
  ]);
};

// The ribbon on the photo: editorial tags come from the vendor ("Best seller",
// "New in").
const tagsOf = (product) => {
  const out = [];
  if (product.tag) out.push({ text: product.tag, cls: "tag-ribbon" });
  if (product.was && product.was > product.price) {
    const off = Math.round((1 - product.price / product.was) * 100);
    if (off >= 5) out.push({ text: `-${off}%`, cls: "tag-ribbon sale" });
  }
  return out;
};

// --------------------------------------------------------------- pieces ----

function productCard(product, reservations, now) {
  const left = availableStock(product, reservations, now);
  const can = sellable(product, reservations, now);
  const ribbons = tagsOf(product);
  return el("a", { class: "p-card", href: `#/p/${product.id}` }, [
    el("div", { class: "p-media" }, [
      el("img", { class: "p-img", src: photoOf(product), alt: product.name, loading: "lazy" }),
      ribbons.length

      el("strong", { class: "p-name", text: product.name }),

      el("div", { class: "p-row" }, [
        el("span", { class: "p-price" }, [
          el("span", { class: "now", text: money(product.price) }),

function home() {
  const reservations = DB.reservations();
  const now = Date.now();
  const products = DB.products;
  const categories = [...new Set(products.map((p) => p.category).filter(Boolean))];
  const sellableCount = products.filter((p) => sellable(p, reservations, now)).length;
  let activeCat = "All";
  let query = "";
  let sort = "recommended";

  // Top rated of each category, best first, the hero pictures real stock.
  const heroPicks = (() => {
    const ranked = [...products]
      .filter((p) => p.available && availableStock(p, reservations, now) > 0)
      .sort((a, b) => (b.rating * b.reviews) - (a.rating * a.reviews));
    const picks = [];
    for (const p of ranked) {
      if (picks.some((x) => x.category === p.category)) continue;
      picks.push(p);
      if (picks.length === 3) break;
    }
    return picks;
  })();

  const SORTS = {
    recommended: { label: "Recommended", cmp: (a, b) => (b.rating * b.reviews) - (a.rating * a.reviews) },
    "price-asc": { label: "Price: low to high", cmp: (a, b) => a.price - b.price },
    "price-desc": { label: "Price: high to low", cmp: (a, b) => b.price - a.price },
    rating: { label: "Top rated", cmp: (a, b) => b.rating - a.rating },
  };

  const grid = el("div", { class: "grid" });
  const count = el("p", { class: "result-line" });

  const paint = () => {
    grid.textContent = "";
    let list = products;
    if (query.trim()) {
      // Same dependency-free fuzzy matcher the admin chat uses; the Fuse.js
      // adapter in matcher.js drops in here for production. The cut is the
      // engine's own threshold: a real match scores near 0.95, and everything
      // below 0.45 is the matcher noticing that two words share letters, a
      // "search" that returns the whole shop is worse than one that returns
      // nothing.
      list = fuzzyMatch(query, searchIndex(products), { key: "_search" })
        .filter((r) => r.score >= 0.45)
        .map((r) => products.find((p) => p.id === r.item.id))
        .filter(Boolean);
    }
    if (activeCat !== "All") list = list.filter((p) => p.category === activeCat);
    list = [...list].sort(SORTS[sort].cmp);
    const inStock = list.filter((p) => sellable(p, reservations, now)).length;
    count.textContent = query.trim()
      ? `${list.length} result${list.length === 1 ? "" : "s"} for “${query.trim()}”`
      : `${list.length} product${list.length === 1 ? "" : "s"} · ${inStock} ready to ship`;
    if (!list.length) {
      grid.appendChild(
        el("div", { class: "empty" }, [
          icon("search", 28),
          el("strong", { text: "Nothing matched that." }),
          el("span", { class: "muted", text: "Try a shorter word, or clear the search." }),
        ])
      );
      return;
    }
    for (const p of list) grid.appendChild(productCard(p, reservations, now));
  };

  const searchInput = el("input", {
    class: "search-input",
    type: "search",
    placeholder: "Search wigs, perfumes, gowns…",
    "aria-label": "Search the shop",
    oninput: UI.debounce((e) => {
      query = e.target.value;
      paint();
    }, 140),
  });

  // The catalogue block is built after the state helpers below (sort, filter)
  // so the section head, the chips and the grid all live in one closure.
  let gridSection;
  const chips = el("div", { class: "chips" },
    ["All", ...categories].map((cat) =>
      el("button", {
        class: `chip ${cat === "All" ? "on" : ""}`,
        text: cat,
        onclick: () => setCat(cat),
      })
    )
  );

  const tileRow = el("div", { class: "cat-tiles" }, categories.map((cat) => {
    const rep = [...products]
      .filter((p) => p.category === cat)
      .sort((a, b) => (b.rating * b.reviews) - (a.rating * a.reviews))[0];
    const n = products.filter((p) => p.category === cat).length;
    return el("button", {
      class: "cat-tile",
      type: "button",
      onclick: () => setCat(cat, true),
    }, [
      el("img", { class: "cat-img", src: photoOf(rep), alt: "", loading: "lazy" }),
      el("span", { class: "cat-meta" }, [
        el("strong", { text: cat }),
        el("span", { class: "muted", text: `${n} item${n === 1 ? "" : "s"}` }),
      ]),
    ]);
  }));

  // Tile and chip are two doors into the same filter, they must agree.
  const setCat = (cat, scroll = false) => {

    return el("section", { class: "page-section rail-section" }, [
      el("div", { class: "section-head" }, [
        el("h2", { class: "section-title", text: "Customer favourites" }),
        el("span", { class: "muted small", text: "What people keep coming back for" }),
      ]),
      el("div", { class: "rail" }, top.map((p) => productCard(p, reservations, now))),
    ]);
  })();

  return el("div", { class: "page shop-page" }, [
    el("section", { class: "hero" }, [
      el("div", { class: "hero-copy" }, [
        el("span", { class: "hero-kicker", text: `${DB.settings.tagline || "New in store"} · Lagos` }),
        el("h1", { class: "hero-title", text: DB.settings.headline || DB.settings.name }),
        el("p", { class: "hero-sub", text: DB.settings.sub || "Order in minutes, pay how you like." }),
        el("div", { class: "hero-cta" }, [
          el("a", { class: "primary-btn", href: "#catalogue", onclick: (e) => { e.preventDefault(); gridSection.scrollIntoView({ behavior: "smooth", block: "start" }); } }, [icon("cart", 18), el("span", { text: "Shop the catalogue" })]),
          el("a", { class: "wa-btn", href: waLink(`Hi ${DB.settings.name}! I'd like to ask about something in your shop.`), target: "_blank", rel: "noopener" }, [icon("wa", 18), el("span", { text: "Chat on WhatsApp" })]),
        ]),
        el("div", { class: "hero-badges" }, [

        ])

    ]),
    el("section", { class: "strip" }, [
      el("div", { class: "strip-item" }, [icon("truck", 18), el("span", {}, [el("strong", { text: "Delivery " }), el("span", { text: `${money(DB.settings.delivery.fee)} in Lagos, free over ${money(DB.settings.delivery.freeOver)}` })])]),
      el("div", { class: "strip-item" }, [icon("bank", 18), el("span", { text: "Transfer, card, or pay the rider" })]),
      el("div", { class: "strip-item" }, [icon("clock", 18), el("span", { text: "45-minute stock hold at checkout" })]),
      el("div", { class: "strip-item" }, [icon("wa", 18), el("span", { text: "Real photos on WhatsApp before you pay" })]),
    ]),
    el("section", { class: "page-section" }, [

function productPage(id) {

// Re-render on demand (after cart edits) without a route change.
function paint() {
  const root = document.getElementById("view");
  if (!root || !root.dataset.storefront) return;
  const route = root.dataset.route || "home";
  const params = (root.dataset.params || "").split(",").filter(Boolean);
  const fn = PAGES[route];
  if (!fn) return;
  root.textContent = "";
  root.appendChild(fn(params));
}

const Storefront = {
  routes: Object.keys(PAGES),
  render(root, route, params) {
    const fn = PAGES[route];
    if (!fn) return false;
    root.dataset.storefront = "1";
    root.dataset.route = route;
    root.dataset.params = params.join(",");
    root.appendChild(fn(params));
    return true;
  },
  paint,
};
return { Storefront };

  const { segments, query } = parseHash();
  const head = segments[0] || "";

  // Admin, it brings its own chrome and login gate.
  if (head === "admin") {
    const route = segments[1] ? `admin-${segments[1]}` : "admin";
    host.textContent = "";
    if (!Admin.render(host, route, refresh)) {
      host.appendChild(el("div", { class: "page" }, [notFound()]));
    }
    lastRendered = location.hash;
    return;
  }

  // Storefront.
  const spec = ROUTES[head];
  host.textContent = "";
  const view = el("main", { class: "site-main", id: "view" });
  host.appendChild(el("div", { class: "site-shell" }, [announce(), header(), view, footer()]));

  if (!spec || head === "") {
    if (!Storefront.render(view, "home", [], query)) view.appendChild(notFound());
    lastRendered = location.hash;
    return;
  }
  const params = segments.slice(1);
  if (!segments.length || !Storefront.render(view, spec.page, params, query)) view.appendChild(notFound());
  lastRendered = location.hash;
}

function refresh() {
  render();
}

// ------------------------------------------------------------------ boot ---

// Theme before first paint, so the page never flashes the wrong colours.
UI.theme.apply(UI.theme.get());

window.addEventListener("hashchange", render);

// Anything that changes state outside a route can repaint through this.
window.addEventListener("ada:refresh", render);

// The cart badge only. Repainting the whole page here would wipe whatever the
// customer is typing in the search box.
window.addEventListener("ada:cart", () => {
  const btn = document.querySelector(".cart-btn");
  if (!btn) return;
  const count = DB.cartCount();
  const existing = btn.querySelector(".cart-count");
  if (!count) {
    if (existing) existing.remove();
    return;
  }
  const badge = existing || btn.appendChild(el("span", { class: "cart-count" }));
  badge.textContent = String(count);
});

// The 45-minute reservation clock. In production this is a Cron Trigger on the
// Worker; here it is the same function on a timer, so the demo can show stock
// coming back without waiting three quarters of an hour.
setInterval(() => {
  if (DB.expireReservations().length === 0) return; // empty array is truthy, check the length
  if (Chat.isOpen) return; // never yank the DOM out from under someone typing
  render();
}, 20000);

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") render();
});

const App = {
  refresh,
  go(route) {
    const href = HREFS[route] || (String(route).startsWith("#") ? route : `#/${route}`);
    if (location.hash === href) refresh();
    else location.hash = href;
  },
  render,
  get lastRendered() {
    return lastRendered;
  },
};

document.title = `${DB.settings.name} · ${DB.settings.tagline}`;
render();
return { App };
})();
const { App } = __scope_app;
</script>
</body>
</html>
